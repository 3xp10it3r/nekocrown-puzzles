name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Google Play Version Code (integer, increment each upload)'
        required: false
        default: '1'
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3 (for Level & Asset Generation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 (Required for Android Gradle Plugin 8+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Puzzle Level Pack & Store Assets
        run: |
          python3 scripts/generate_levels.py
          python3 scripts/generate_store_assets.py
          node scripts/verify_game_logic.js

      - name: Install Dependencies & Add Android Platform
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject Version Code, AdMob App ID & Release Keystore
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
        run: |
          # Update versionCode and versionName in android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/g" android/app/build.gradle

          # Inject AdMob APPLICATION_ID meta-data into AndroidManifest.xml if not present
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml; then
            sed -i "s|</application>|    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"/>\n    </application>|" android/app/src/main/AndroidManifest.xml
          fi

      - name: Generate Upload Keystore (or Decode from GitHub Secrets)
        run: |
          if [ -n "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          else
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass neoncrown2026 \
              -keypass neoncrown2026 \
              -dname "CN=NekoCrown Studio, OU=Mobile, O=NekoCrown, L=Bengaluru, S=KA, C=IN"
          fi

      - name: Build Debug APK & Signed Release AAB
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'neoncrown2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASS: ${{ secrets.KEY_PASS || 'neoncrown2026' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/upload-keystore.jks \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASS}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASS}"

      - name: Upload Play Store AAB, Debug APK & Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nekocrown-playstore-release-bundle
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/upload-keystore.jks
            store-assets/*
